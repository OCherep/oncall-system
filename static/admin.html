:root, [data-theme="light"] {
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
  --border: #e2e8f0; --primary: #2563eb; --nav: #ffffff; --side: #f1f5f9;
  --input-bg: #fff; --table-head: #f8fafc;
}
[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
  --border: #334155; --primary: #3b82f6; --nav: #1e293b; --side: #0f172a;
  --input-bg: #1e293b; --table-head: #1e293b;
}
html, body { background: var(--bg) !important; color: var(--text) !important; }
.navbar { background: var(--nav) !important; color: var(--text) !important; border-color: var(--border) !important; }
.sidebar { background: var(--side) !important; }
.card, .modal-content { background: var(--card) !important; color: var(--text) !important; border-color: var(--border) !important; }
table th { background: var(--table-head) !important; }
input, select, textarea { background: var(--input-bg) !important; color: var(--text) !important; border-color: var(--border) !important; }
.theme-toggle { display:inline-flex; gap:4px; align-items:center; margin-right:12px; }
.theme-toggle button { padding:4px 8px; font-size:12px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; }
.theme-toggle button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

    <script>

(function(){
  const KEY='oncall_theme';
  function sysTheme(){ return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'; }
  function applyTheme(mode){
    const m = mode||localStorage.getItem(KEY)||'system';
    const resolved = m==='system' ? sysTheme() : m;
    document.documentElement.setAttribute('data-theme', resolved);
    document.querySelectorAll('.theme-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.theme===m));
  }
  window.setTheme = function(mode){
    localStorage.setItem(KEY, mode);
    document.cookie = 'oncall_theme='+encodeURIComponent(mode)+'; Path=/; Max-Age='+(30*24*3600)+'; SameSite=Lax';
    applyTheme(mode);
  };
  function isLastDayOfMonth(d){ const t=new Date(d.getFullYear(), d.getMonth()+1, 0); return d.getDate()===t.getDate(); }
  function clearServiceCookies(){
    const keep=new Set(['oncall_user','oncall_name']);
    document.cookie.split(';').forEach(c=>{
      const name=c.split('=')[0].trim();
      if(!name||keep.has(name)) return;
      if(name.startsWith('oncall_')) document.cookie=name+'=; Path=/; Max-Age=0; SameSite=Lax';
    });
  }
  const now=new Date();
  const marker=now.getFullYear()+'-'+(now.getMonth()+1);
  if(isLastDayOfMonth(now)){
    if(localStorage.getItem('oncall_cookie_reset')!==marker){ clearServiceCookies(); localStorage.setItem('oncall_cookie_reset', marker); }
  }
  applyTheme();
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if((localStorage.getItem(KEY)||'system')==='system') applyTheme('system'); }); }catch(e){}
})();
function themeToggleHTML(){
  return '<span class="theme-toggle">'+
    '<button type="button" data-theme="system" onclick="setTheme(\'system\')">Авто</button>'+
    '<button type="button" data-theme="light" onclick="setTheme(\'light\')">☀</button>'+
    '<button type="button" data-theme="dark" onclick="setTheme(\'dark\')">🌙</button></span>';
}


        let currentUser = null;
        let currentMainMenu = 'management';
        let currentSubPage = 'queues';


        function switchMainMenu(menu) {
            currentMainMenu = menu;
            document.querySelectorAll('.main-menu-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('menu-btn-' + menu);
            if (btn) btn.classList.add('active');
            if (menu === 'management') loadSubPage(currentSubPage === 'dictionaries' || String(currentSubPage||'').startsWith('proj-') ? 'queues' : (currentSubPage || 'queues'));
            if (menu === 'settings') loadSubPage('dictionaries');
        }

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('open');
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            if (currentMainMenu === 'management') {
                sidebar.innerHTML = `
                    <div class="sidebar-section-title">МЕНЕДЖМЕНТ</div>

                    <div class="sidebar-item ${currentSubPage==='queues'?'active':''}" onclick="loadSubPage('queues')"><span class="nav-label">Черги задач</span><span class="nav-dot hidden" id="dot-queues" title="Є зміни"></span></div>

                    <div class="sidebar-item ${currentSubPage==='inc-archive'?'active':''}" onclick="loadSubPage('inc-archive')"><span class="nav-label">Усі звернення</span><span class="nav-dot hidden" id="dot-incidents" title="Відкриті звернення"></span></div>

                `;
            } else if (currentMainMenu === 'settings') {
                sidebar.innerHTML = `
                    <div class="dropdown-container">
                        <div class="sidebar-item" onclick="toggleDropdown('sys-dropdown')">
                            <span>Система</span><span>&#9660;</span>
                        </div>
                        <div class="dropdown-menu open" id="sys-dropdown">

                        </div>

        function logout() {
            try { fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
            localStorage.removeItem('u');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('oncall_session_token');
            document.cookie = 'oncall_user=; Path=/; Max-Age=0; SameSite=Lax';
            document.cookie = 'oncall_name=; Path=/; Max-Age=0; SameSite=Lax';
            document.cookie = 'oncall_role=; Path=/; Max-Age=0; SameSite=Lax';
            window.location.href = '/';
        }


        async function ensureSession() {
            try {
                const r = await fetch('/api/session/me', { credentials: 'same-origin' });
                if (r.ok) {
                    const u = await r.json();
                    currentUser = u;
                    localStorage.setItem('u', JSON.stringify(u));
                    return true;
                }
            } catch (e) {}
            const saved = localStorage.getItem('u') || localStorage.getItem('currentUser');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    return true;
                } catch (e) {}
            }
            return false;
        }

        window.__bootAdmin = async function bootAdmin() {
            const showErr = (msg) => {
                console.error('[admin]', msg);
                const c = document.getElementById('page-container');
                if (c) c.innerHTML = '<div class="card" style="padding:16px;color:#b91c1c"><b>Помилка адмінки:</b> ' +
                    String(msg).replace(/</g,'&lt;') +
                    '<br><button class="btn btn-primary" style="margin-top:10px" onclick="location.reload()">Перезавантажити</button></div>';
            };
            try {
                console.log('[admin] boot', {
                    renderSidebar: typeof renderSidebar,
                    loadSubPage: typeof loadSubPage,
                    ensureSession: typeof ensureSession
                });
                // 1) Session (non-fatal for showing shell)
                let ok = false;
                try { ok = await ensureSession(); } catch (e) { console.warn('ensureSession', e); }
                if (!ok) {
                    // last chance: cookie oncall_user
                    const m = document.cookie.match(/(?:^|; )oncall_user=([^;]*)/);
                    if (m) {
                        currentUser = currentUser || { username: decodeURIComponent(m[1]), role: 'admin', name: decodeURIComponent(m[1]) };
                        ok = true;
                    }
                }
                if (!ok) { window.location.href = '/'; return; }
                if (currentUser && currentUser.role && currentUser.role !== 'admin') {
                    alert('Доступ лише для адміністраторів');
                    window.location.href = '/';
                    return;
                }
                // if role missing from session soft-cache — still try (legacy)
                const nameEl = document.getElementById('user-info');
                if (nameEl && currentUser) nameEl.textContent = currentUser.name || currentUser.username || '';

                if (typeof renderSidebar !== 'function') {
                    showErr('renderSidebar is not a function (typeof=' + typeof renderSidebar + ')');
                    return;
                }
                renderSidebar();

                if (typeof loadSubPage !== 'function') {
                    showErr('loadSubPage is not a function');
                    return;
                }
                await loadSubPage(currentSubPage || 'queues');
                console.log('[admin] boot complete, page=', currentSubPage);
            } catch (e) {
                showErr((e && e.stack) ? e.stack : e);
            }
        };
        // Always schedule after full parse
        setTimeout(function(){ window.__bootAdmin(); }, 0);

        function dailyShift(delta) {
            const cur = window._dailyDate || new Date().toISOString().slice(0,10);
            const d = new Date(cur + 'T12:00:00');
            d.setDate(d.getDate() + delta);
            window._dailyDate = d.toISOString().slice(0,10);
            const inp = document.getElementById('daily-date');
            if (inp) inp.value = window._dailyDate;
            loadDailyBoard();
        }
        async function loadDailyBoard() {
            const day = window._dailyDate || new Date().toISOString().slice(0,10);
            window._dailyDate = day;
            const inp = document.getElementById('daily-date');
            if (inp) inp.value = day;
            try {
                if (!window._dailyMembers) {
                    try {
                        const ur = await fetch('/api/admin/users', { credentials: 'same-origin' });
                        window._dailyMembers = await safeJson(ur);
                        if (!Array.isArray(window._dailyMembers)) window._dailyMembers = [];
                    } catch (e) { window._dailyMembers = []; }
                }
                const members = window._dailyMembers || [];
                const memberOpts = (selected) => {
                    let h = '<option value="">— без виконавця —</option>';
                    members.forEach(m => {
                        const name = m.name || m.username || '';
                        if (!name) return;
                        h += `<option value="${name.replace(/"/g,'&quot;')}" ${name===selected?'selected':''}>${name.replace(/</g,'&lt;')}</option>`;
                    });
                    return h;
                };
                const taskStatuses = ['Нова','У роботі','На паузі','До перевірки','Виконана','Перевідкрита','Архів'];

                const r = await fetch('/api/admin/daily-board?date=' + encodeURIComponent(day), { credentials: 'same-origin' });
                if (r.status === 401) { alert('Сесія закінчилась — увійдіть знову'); location.href='/'; return; }
                const d = await safeJson(r);
                window._dailyBoardCache = d;

                // status chips for tasks + incidents
                const by = d.by_status || {};
                const tasks = d.tasks || [];
                const incs = d.incidents || [];
                const incBy = {};
                incs.forEach(i => { const s=i.status||'Нове'; incBy[s]=(incBy[s]||0)+1; });

                const sum = document.getElementById('daily-summary');
                if (sum) {
                    sum.innerHTML = `
                      <div class="card" style="padding:12px;text-align:center"><div style="font-size:11px;opacity:.7">Дата</div><div style="font-size:18px;font-weight:700">${d.date||day}</div></div>
                      <div class="card" style="padding:12px;text-align:center"><div style="font-size:11px;opacity:.7">Основний</div><div style="font-weight:600">${d.primary||'—'}</div></div>
                      <div class="card" style="padding:12px;text-align:center"><div style="font-size:11px;opacity:.7">Дубль</div><div style="font-weight:600">${d.backup||'—'}</div></div>
                      <div class="card" style="padding:12px;text-align:center;border-left:3px solid #ef4444"><div style="font-size:11px;opacity:.7">Без виконавця</div><div style="font-size:20px;font-weight:700;color:#ef4444">${d.unassigned||0}</div></div>
                      <div class="card" style="padding:12px;text-align:center;border-left:3px solid #8b5cf6"><div style="font-size:11px;opacity:.7">Jira</div><div style="font-size:20px;font-weight:700">${d.jira_linked||0}</div></div>
                    `;
                }
                const ogLine = document.getElementById('daily-ongrid-line');
                if (ogLine) {
                  ogLine.textContent = 'Чергові: '+(d.primary||'—')+' / '+(d.backup||'—')+' · режим завантаження…';
                  fetch('/api/admin/settings',{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(s=>{
                    if (!s || !ogLine) return;
                    const mode = s._on_grid_now==='1' ? 'ON-GRID' : 'OFF-GRID';
                    ogLine.innerHTML = 'Чергові: <b>'+(d.primary||'—')+'</b> / <b>'+(d.backup||'—')+'</b> · режим: <b>'+mode+'</b> ('+(s.on_grid_start||'')+'–'+(s.on_grid_end||'')+')';
                  }).catch(()=>{});
                }
                const chips = document.getElementById('daily-status-chips');
                if (chips) {
                    const chipClass = (s) => {
                        const x = String(s||'').toLowerCase();
                        if (x === 'нова' || x === 'нове') return 'st-chip-nova';
                        if (x.includes('робот')) return 'st-chip-work';
                        if (x.includes('пауз')) return 'st-chip-pause';
                        if (x.includes('перевір')) return 'st-chip-check';
                        if (x.includes('виконан') || x.includes('вирішен')) return 'st-chip-done';
                        if (x.includes('перевідкр')) return 'st-chip-reopen';
                        if (x.includes('архів')) return 'st-chip-arch';
                        return 'st-chip-default';
                    };
                    const renderChips = (order, counts) => {
                        let h = '';
                        const seen = new Set();
                        order.forEach(s => {
                            const n = counts[s]||0;
                            if (!n) return;
                            seen.add(s);
                            h += `<span class="st-chip ${chipClass(s)}">${s}: <b>${n}</b></span>`;
                        });
                        Object.keys(counts).forEach(s => {
                            if (seen.has(s) || !counts[s]) return;
                            h += `<span class="st-chip ${chipClass(s)}">${s}: <b>${counts[s]}</b></span>`;
                        });
                        return h || '<span class="st-chip st-chip-default">немає</span>';
                    };
                    const orderT = ['Нова','У роботі','На паузі','До перевірки','Виконана','Перевідкрита'];
                    const orderI = ['Нове','В роботі','На паузі','Вирішено'];
                    chips.innerHTML = `<div class="daily-chips">
                      <div class="daily-chips-row"><span class="daily-chips-label">Задачі</span>${renderChips(orderT, by)}</div>
                      <div class="daily-chips-row"><span class="daily-chips-label">Звернення</span>${renderChips(orderI, incBy)}</div>
                    </div>`;
                }

                const tb = document.getElementById('daily-tasks-body');
                if (tb) {
                    if (!tasks.length) tb.innerHTML = '<tr><td colspan="9" style="opacity:.6">Немає задач на цю дату</td></tr>';
                    else tb.innerHTML = tasks.map(t => {
                        const src = t.source==='jira'?'<span class="badge" style="background:#7c3aed;color:#fff">Jira</span>':(t.source==='incident'?'<span class="badge" style="background:#2563eb;color:#fff">Inc</span>':'<span class="badge" style="background:#475569;color:#fff">OnCall</span>');
                        const jira = t.external_id ? `<span style="color:#93c5fd">${t.external_id}</span>` : '—';
                        const stOpts = taskStatuses.map(s => `<option value="${s}" ${s===(t.status||'')?'selected':''}>${s}</option>`).join('');
                        return `<tr data-task="${t.id}">
                          <td>${src}</td>
                          <td>#${t.id}</td>
                          <td style="max-width:220px">${(t.task_description||'').replace(/</g,'&lt;')}</td>
                          <td><select style="min-width:120px;max-width:160px" onchange="dailyPatchTask(${t.id},{user_name:this.value})">${memberOpts(t.user_name||'')}</select></td>
                          <td><select onchange="dailyPatchTask(${t.id},{status:this.value})">${stOpts}</select></td>
                          <td>${(t.priority||'').replace(/</g,'&lt;')}</td>
                          <td><input type="date" value="${t.due_date||''}" style="max-width:130px" onchange="dailyPatchTask(${t.id},{due_date:this.value})"></td>
                          <td>${jira}</td>
                          <td style="white-space:nowrap">
                            <button class="btn" style="padding:2px 8px" title="Коментарі" onclick="dailyToggleTaskCmt(${t.id})">💬</button>
                          </td>
                        </tr>
                        <tr id="daily-cmt-row-${t.id}" style="display:none"><td colspan="9">
                          <div id="daily-cmt-${t.id}" style="padding:8px;font-size:12px">…</div>
                          <div style="display:flex;gap:6px;margin-top:6px;max-width:640px">
                            <input id="daily-cmt-inp-${t.id}" placeholder="Коментар" style="flex:1;padding:6px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0">
                            <button class="btn btn-primary" onclick="dailyPostTaskCmt(${t.id})">+</button>
                          </div>
                        </td></tr>`;
                    }).join('');
                }

                const ib = document.getElementById('daily-incs-body');
                if (ib) {
                    if (!incs.length) ib.innerHTML = '<tr><td colspan="7" style="opacity:.6">Немає відкритих звернень</td></tr>';
                    else ib.innerHTML = incs.map(i => {
                        const stOpts = ['Нове','В роботі','На паузі','Вирішено','Архів'].map(s =>
                          `<option value="${s}" ${s===(i.status||'')?'selected':''}>${s}</option>`).join('');
                        return `<tr>
                          <td>#${i.id}</td>
                          <td style="max-width:220px">${(i.description||'').replace(/</g,'&lt;')}</td>
                          <td><select onchange="dailyPatchInc(${i.id},{status:this.value})">${stOpts}</select></td>
                          <td>${(i.priority||'').replace(/</g,'&lt;')}</td>
                          <td><select style="min-width:120px" onchange="dailyPatchInc(${i.id},{user_name:this.value})">${memberOpts(i.user_name||'')}</select></td>
                          <td>${i.source||''}${i.external_id?' · '+i.external_id:''}</td>
                          <td><button class="btn" style="padding:2px 8px" onclick="dailyToggleIncCmt(${i.id})">💬</button></td>
                        </tr>
                        <tr id="daily-inc-cmt-row-${i.id}" style="display:none"><td colspan="7">
                          <div id="daily-inc-cmt-${i.id}" style="padding:8px;font-size:12px">…</div>
                          <div style="display:flex;gap:6px;margin-top:6px;max-width:640px">
                            <input id="daily-inc-cmt-inp-${i.id}" placeholder="Коментар" style="flex:1;padding:6px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0">
                            <button class="btn btn-primary" onclick="dailyPostIncCmt(${i.id})">+</button>
                          </div>
                        </td></tr>`;
                    }).join('');
                }
            } catch (e) {
                console.error(e);
                alert('Помилка дашборду: ' + e.message);
            }
        }

            const r = await fetch('/api/daily-tasks', { method: 'PUT', credentials: 'same-origin',

        function memberSelectHtml(selected, onchange, emptyLabel) {
            const opts = ['<option value="">' + (emptyLabel || '—') + '</option>']
                .concat((loadedUsers || []).filter(u => u.role !== 'admin' || u.is_oncall).map(u =>
                    `<option value="${u.name}" ${u.name===selected?'selected':''}>${u.name}</option>`
                ));
            return `<select style="min-width:110px;padding:4px" onchange="${onchange}">${opts.join('')}</select>`;
        }
        async function ensureUsersLoaded() {
            if (loadedUsers && loadedUsers.length) return;
            try {
                const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
                const t = ctrl ? setTimeout(() => ctrl.abort(), 8000) : null;
                const r = await fetch('/api/admin/users', { credentials: 'same-origin', signal: ctrl ? ctrl.signal : undefined });
                if (t) clearTimeout(t);
                loadedUsers = await safeJson(r);
            } catch (e) {
                console.warn('ensureUsersLoaded', e);
                loadedUsers = loadedUsers || [];
            }
            if (!Array.isArray(loadedUsers)) loadedUsers = [];
        }
        async function safeJson(res) {
            if (!res.ok) {
                console.error('API', res.url, res.status);
                return [];
            }
            try { return await res.json(); } catch (e) { console.error(e); return []; }
        }
        async function loadDictionariesData() {
            try {
                const [uRes, rRes, aRes] = await Promise.all([
                    fetch('/api/admin/users'),
                    fetch('/api/admin/roles'),
                    fetch('/api/admin/absence-types')
                ]);
                loadedUsers = await safeJson(uRes);
                loadedRoles = await safeJson(rRes);
                loadedAbsTypes = await safeJson(aRes);
                if (!Array.isArray(loadedUsers)) loadedUsers = [];
                if (!Array.isArray(loadedRoles)) loadedRoles = [];
                if (!Array.isArray(loadedAbsTypes)) loadedAbsTypes = [];

                const ut = document.getElementById('users-table');
                if (ut) {
                    ut.innerHTML = loadedUsers.length ? loadedUsers.map(u => `
                        <tr>
                            <td>${escHtml(u.name)}</td>
                            <td>${escHtml(u.username)}</td>
                            <td>${escHtml(u.email||'—')}</td>
                            <td><code>${escHtml(u.slack_id||'—')}</code></td>
                            <td>${escHtml(u.phone||'—')}</td>
                            <td>${escHtml(u.role||'')}</td>
                            <td>${escHtml(u.team_role||'—')}</td>
                            <td>${u.is_oncall ? 'Так' : 'Ні'}</td>
                            <td>
                                <button class="btn" onclick="editUser(${u.id})">Редагувати</button>
                                <button class="btn btn-danger" onclick="deleteUser(${u.id})">Видалити</button>
                            </td>
                        </tr>`).join('') : '<tr><td colspan="9">Немає користувачів</td></tr>';
                }

                const rt = document.getElementById('roles-table');
                if (rt) {
                    rt.innerHTML = loadedRoles.length ? loadedRoles.map(r => `
                        <tr>
                            <td>${r.id}</td>
                            <td>${escHtml(r.name)}</td>
                            <td>
                                <button class="btn" onclick="editRole(${r.id}, '${String(r.name||'').replace(/'/g,"\\'")}')">Редагувати</button>
                                <button class="btn btn-danger" onclick="deleteRole(${r.id})">Видалити</button>
                            </td>
                        </tr>`).join('') : '<tr><td colspan="3">Немає ролей</td></tr>';
                }

                fillTeamRoleSelect();

                const at = document.getElementById('absence-types-table');
                if (at) {
                    at.innerHTML = loadedAbsTypes.length ? loadedAbsTypes.map(a => `
                        <tr>
                            <td>${a.id}</td>
                            <td>${escHtml(a.name)}</td>
                            <td><code>${escHtml(a.code)}</code></td>
                            <td>
                                <button class="btn" onclick="editAbsType(${a.id}, '${String(a.name||'').replace(/'/g,"\\'")}', '${String(a.code||'').replace(/'/g,"\\'")}')">Редагувати</button>
                                <button class="btn btn-danger" onclick="deleteAbsType(${a.id})">Видалити</button>
                            </td>
                        </tr>`).join('') : '<tr><td colspan="4" style="color:#64748b">Типів немає — натисніть «+ Тип»</td></tr>';
                }
            } catch (e) {
                console.error('loadDictionariesData', e);
                alert('Помилка довідників: ' + e.message);
            }
        }

        function escHtml(s) {
            return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function fillTeamRoleSelect(selectedId) {
            const roleSelect = document.getElementById('user-team-role');
            if (!roleSelect) return;
            const roles = Array.isArray(loadedRoles) ? loadedRoles : [];
            roleSelect.innerHTML = '<option value="">— без ролі —</option>' +
                roles.map(r => `<option value="${r.id}">${escHtml(r.name)}</option>`).join('');
            if (selectedId != null && selectedId !== '' && selectedId !== 0) {
                roleSelect.value = String(selectedId);
            }
        }

        async function runSqlQuery() {
            const query = document.getElementById('sql-query').value;
            const res = await fetch('/api/admin/project/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const div = document.getElementById('sql-results');
            if (!res.ok) {
                const err = await res.text();
                div.innerHTML = `<div style="color:red;">Помилка: ${err}</div>`;
                return;
            }
            const data = await res.json();
            if (!data.rows || data.rows.length === 0) {
                div.innerHTML = '<em>Результатів немає</em>';
                return;
            }

            let html = '<table><thead><tr>' + data.columns.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
            data.rows.forEach(r => {
                html += '<tr>' + data.columns.map(c => `<td>${r[c] !== null ? r[c] : ''}</td>`).join('') + '</tr>';
            });
            html += '</tbody></table>';
            div.innerHTML = html;
        }

                if (!r.ok) { alert('Помилка завантаження черг: ' + (await r.text())); return; }
                const d = await r.json();
                window._queuesCache = d;
                const sum = document.getElementById('queues-summary');

                    sum.innerHTML = `

                        <div class="card" style="padding:14px;text-align:center;border-left:4px solid #f59e0b"><div style="font-size:11px;color:var(--muted,#64748b)">Due на дату</div><div style="font-size:22px;font-weight:700;color:#f59e0b">${d.tasks_due_today||0}</div></div>
                        <div class="card" style="padding:14px;text-align:center;border-left:4px solid #2563eb"><div style="font-size:11px;color:var(--muted,#64748b)">Звернення за день</div><div style="font-size:22px;font-weight:700;color:#2563eb">${incAll}</div></div>
                    `;
                }
                const stBody = document.getElementById('queues-by-status');

                    const keys = [...order.filter(k=>by[k]!=null), ...Object.keys(by).filter(k=>!order.includes(k))];
                    stBody.innerHTML = keys.length
                        ? keys.map(k=>`<tr class="q-row" style="cursor:pointer" onclick="openQueueTasksByStatus('${String(k).replace(/'/g,"\\'")}')"><td><span class="badge badge-secondary">${k}</span></td><td><b>${by[k]}</b></td></tr>`).join('')

                if (asBody) {
                    const list = d.tasks_by_assignee || [];
                    asBody.innerHTML = list.length
                        ? list.map(a => {
                            const name = a.user_name || a.name || '—';
                            return `<tr class="q-row" style="cursor:pointer" onclick="openQueueTasksByAssignee('${String(name).replace(/'/g,"\\'")}')"><td>${name}</td><td>${a.total||a.count||0}</td><td style="color:#ef4444"><b>${a.open||a.open_count||0}</b></td></tr>`;

        async function runSQL() {

                const r = await fetch('/api/admin/project/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-DB-Admin-Password': (window.DB_ADMIN_PASSWORD || 'db-admin-change-me') },

                if (!r.ok) { out.innerHTML = `<span style="color:#ef4444">${d.error || d.message || r.status}</span>`; return; }
                // flexible shape
                const cols = d.columns || (d.rows && d.rows[0] ? Object.keys(d.rows[0]) : []);
                const rows = d.rows || d.data || [];
                if (!rows.length) { out.innerHTML = '<p>Порожній результат</p>'; return; }
                out.innerHTML = `<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>` +
                    rows.map(row => `<tr>${cols.map(c => `<td>${String(row[c]??'').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('') +
                    `</tbody></table>`;

            document.getElementById('edit-priority').innerHTML = prios.map(s => `<option ${s===(task.priority||'Базова')?'selected':''}>${s}</option>`).join('');
            document.getElementById('edit-entity-modal').style.display = 'flex';
        }
        async function openEditInc(id) {
            await ensureUsersLoaded();
            const inc = (window._adminIncsCache || []).find(x => x.id === id);
            if (!inc) { alert('Звернення не знайдено, оновіть список'); return; }
            document.getElementById('edit-entity-kind').value = 'incident';
            document.getElementById('edit-entity-id').value = id;
            document.getElementById('edit-entity-title').textContent = 'Редагування звернення #' + id;
            document.getElementById('edit-date').value = inc.date || '';
            document.getElementById('edit-desc').value = inc.description || '';
            document.getElementById('edit-duration').value = inc.duration_minutes || 15;
            document.getElementById('edit-type-wrap').style.display = '';
            document.getElementById('edit-dur-wrap').style.display = '';
            document.getElementById('edit-src-wrap').style.display = '';
            document.getElementById('edit-resp-wrap').style.display = 'none';
            document.getElementById('edit-due-wrap').style.display = 'none';
            document.getElementById('edit-vis-wrap').style.display = 'none';
            document.getElementById('edit-type').value = inc.type || 'Звернення';
            document.getElementById('edit-source').value = inc.source || 'self';
            fillMemberSelectEl(document.getElementById('edit-user'), inc.user_name || '', true);
            const statuses = ['Нове','В роботі','На паузі','Вирішено','Архів'];
            const prios = ['Звичайний','Підвищений','Високий','Критичний','Терміновий'];
            if (inc.priority && !prios.includes(inc.priority)) prios.push(inc.priority);
            document.getElementById('edit-status').innerHTML = statuses.map(s => `<option ${s===(inc.status||'Нове')?'selected':''}>${s}</option>`).join('');
            document.getElementById('edit-priority').innerHTML = prios.map(s => `<option ${s===(inc.priority||'Звичайний')?'selected':''}>${s}</option>`).join('');
            document.getElementById('edit-entity-modal').style.display = 'flex';
        }
        async function saveEditEntity() {
            const kind = document.getElementById('edit-entity-kind').value;
            const id = parseInt(document.getElementById('edit-entity-id').value, 10);
            const actor = (currentUser && currentUser.name) || 'admin';
            if (kind === 'task') {
                const body = {
                    id, role: 'admin', actor,
                    date: document.getElementById('edit-date').value,
                    user_name: document.getElementById('edit-user').value,
                    responsible: document.getElementById('edit-resp').value,
                    status: document.getElementById('edit-status').value,
                    priority: document.getElementById('edit-priority').value,
                    task_description: document.getElementById('edit-desc').value,
                    due_date: document.getElementById('edit-due').value,
                    visible_from: document.getElementById('edit-visible').value
                };
                const r = await fetch('/api/admin/tasks', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!r.ok) { alert(await r.text() || 'Помилка'); return; }
                closeEditEntity();
                loadAdminTasks();
            } else {
                const body = {
                    id, role: 'admin', actor,
                    date: document.getElementById('edit-date').value,
                    user_name: document.getElementById('edit-user').value,
                    status: document.getElementById('edit-status').value,
                    priority: document.getElementById('edit-priority').value,
                    description: document.getElementById('edit-desc').value,
                    duration_minutes: parseInt(document.getElementById('edit-duration').value, 10) || 15,
                    type: document.getElementById('edit-type').value,
                    source: document.getElementById('edit-source').value
                };
                const r = await fetch('/api/incidents', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!r.ok) { alert(await r.text() || 'Помилка'); return; }
                closeEditEntity();
                loadIncArchive();
            }
        }

<script>
/* failsafe: if boot did not paint sidebar in 1.5s, try again or show hint */

  var side = document.getElementById('sidebar');
  var empty = side && !side.innerHTML.trim();
  if (empty) {
    console.warn('[admin] sidebar still empty, retry boot');
    if (typeof window.__bootAdmin === 'function') window.__bootAdmin();
    else if (typeof window.renderSidebar === 'function') {
      window.renderSidebar();
      if (typeof window.loadSubPage === 'function') window.loadSubPage('queues');
    } else {
      var c = document.getElementById('page-container');
      if (c) c.innerHTML = '<div style="padding:16px;color:#b91c1c">Скрипт адмінки не завантажився повністю. Зробіть hard refresh (Cmd+Shift+R) або перевірте <code>git pull</code> на сервері.</div>';
    }
  }
}, 1500);
