<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адміністрування - OnCall System</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 18px;
            color: var(--primary-color);
            text-decoration: none;
        }

        .main-menu { display: flex; gap: 10px; }

        .main-menu-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #64748b;
        }

        .main-menu-btn.active {
            background-color: #eff6ff;
            color: var(--primary-color);
            border-color: #bfdbfe;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-color);
            font-size: 14px;
        }

        .btn:hover { background-color: #f1f5f9; }
        .btn-primary { background-color: var(--primary-color); color: white; border: none; }
        .btn-danger { background-color: var(--danger-color); color: white; border: none; }

        .layout {
            margin-top: 60px;
            display: flex;
            min-height: calc(100vh - 60px);
        }

        .sidebar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid var(--border-color);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-section {
            font-size: 12px;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
            padding: 5px 10px;
        }

        .sidebar-item {
            padding: 10px;
            border-radius: 6px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 600;
        }

        .dropdown-container { display: flex; flex-direction: column; gap: 2px; }
        .dropdown-menu { display: none; flex-direction: column; gap: 2px; padding-left: 15px; }
        .dropdown-menu.open { display: flex; }

        .content {
            flex: 1;
            padding: 20px 40px;
            max-width: 1200px;
        }

        .breadcrumbs { font-size: 12px; color: #64748b; margin-bottom: 15px; }

        .card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-header h2 { margin: 0; font-size: 18px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th { background-color: #f8fafc; font-weight: 600; }

        .badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge-secondary { background-color: #f1f5f9; color: #475569; }
        .badge-warning { background-color: #fef3c7; color: #92400e; }

        .console-box {
            background-color: #0f172a;
            color: #38bdf8;
            font-family: monospace;
            padding: 15px;
            border-radius: 6px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 100%; max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 12c-2-2.5-4-4-6-4a4 4 0 0 0 0 8c2 0 4-1.5 6-4zm0 0c2 2.5 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.5-6 4z"/>
                </svg>
                <span>OnCall System</span>
            </a>

            <a href="/" class="btn">&#8592; Повернутись до графіку</a>

            <div class="main-menu">
                <button class="main-menu-btn active" id="menu-btn-management" onclick="switchMainMenu('management')">Менеджмент</button>
                <button class="main-menu-btn" id="menu-btn-settings" onclick="switchMainMenu('settings')">Налаштування</button>
            </div>
        </div>

        <div class="nav-right">
            <span id="user-info" style="font-weight: 500;"></span>
            <button class="btn btn-primary" onclick="logout()">Sign Out</button>
        </div>
    </nav>

    <div class="layout">
        <div class="sidebar" id="sidebar"></div>
        <div class="content">
            <div class="breadcrumbs" id="breadcrumbs">Головна / Адміністрування</div>
            <div id="page-container"></div>
        </div>
    </div>

    <!-- TODO: Keep Dictionary CRUD Modals -->
    <!-- Модалка користувача -->
    <div class="modal" id="user-modal">
        <div class="modal-content">
            <h3 id="user-modal-title">Додати / Редагувати користувача</h3>
            <input type="hidden" id="user-id">
            <div class="form-group"><label>ПІБ / Ім'я</label><input type="text" id="user-name"></div>
            <div class="form-group"><label>Логін</label><input type="text" id="user-username"></div>
            <div class="form-group"><label>Пароль (залиште порожнім, якщо не змінюється)</label><input type="password" id="user-password"></div>
            <div class="form-group"><label>Системна роль</label><select id="user-role"><option value="user">user</option><option value="admin">admin</option></select></div>
            <div class="form-group"><label>Роль у команді</label><select id="user-team-role"></select></div>
            <div style="display:flex; gap:10px;"><input type="checkbox" id="user-is-oncall" checked><label>Чергує</label></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button class="btn" onclick="closeModal('user-modal')">Скасувати</button>
                <button class="btn btn-primary" onclick="saveUser()">Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Модалка командної ролі -->
    <div class="modal" id="role-modal">
        <div class="modal-content">
            <h3 id="role-modal-title">Роль у команді</h3>
            <input type="hidden" id="role-id">
            <div class="form-group"><label>Назва ролі</label><input type="text" id="role-name"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button class="btn" onclick="closeModal('role-modal')">Скасувати</button>
                <button class="btn btn-primary" onclick="saveRole()">Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Модалка типу відсутності -->
    <div class="modal" id="abs-modal">
        <div class="modal-content">
            <h3 id="abs-modal-title">Тип відсутності</h3>
            <input type="hidden" id="abs-id">
            <div class="form-group"><label>Назва</label><input type="text" id="abs-name"></div>
            <div class="form-group"><label>Код (English)</label><input type="text" id="abs-code"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button class="btn" onclick="closeModal('abs-modal')">Скасувати</button>
                <button class="btn btn-primary" onclick="saveAbsenceType()">Зберегти</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentMainMenu = 'management';
        let currentSubPage = 'approval';
        let loadedUsers = [], loadedRoles = [], loadedAbsTypes = [];

        window.onload = function() {
            // index.html stores session as 'u'; keep fallback to 'currentUser'
            const saved = localStorage.getItem('u') || localStorage.getItem('currentUser');
            if (!saved) { window.location.href = '/'; return; }
            try { currentUser = JSON.parse(saved); } catch (e) { window.location.href = '/'; return; }
            if (!currentUser || currentUser.role !== 'admin') {
                alert('Доступ лише для admin');
                window.location.href = '/';
                return;
            }
            document.getElementById('user-info').innerText = `${currentUser.name} (${currentUser.role})`;
            switchMainMenu('management');
        };

        function logout() {
            localStorage.removeItem('u');
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }

        function switchMainMenu(menu) {
            currentMainMenu = menu;
            document.getElementById('menu-btn-management').classList.toggle('active', menu === 'management');
            document.getElementById('menu-btn-settings').classList.toggle('active', menu === 'settings');

            renderSidebar();

            if (menu === 'management') loadSubPage('approval');
            if (menu === 'settings') loadSubPage('dictionaries');
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (currentMainMenu === 'management') {
                sidebar.innerHTML = `
                    <div class="sidebar-section">Менеджмент</div>
                    <div class="sidebar-item ${currentSubPage==='queues'?'active':''}" onclick="loadSubPage('queues')">Черги задач</div>
                    <div class="sidebar-item ${currentSubPage==='tasks'?'active':''}" onclick="loadSubPage('tasks')">Усі задачі</div>
                    <div class="sidebar-item ${currentSubPage==='inc-archive'?'active':''}" onclick="loadSubPage('inc-archive')">Архів звернень</div>
                    <div class="sidebar-item ${currentSubPage==='approval'?'active':''}" onclick="loadSubPage('approval')">Для затвердження</div>
                `;
            } else if (currentMainMenu === 'settings') {
                sidebar.innerHTML = `
                    <div class="dropdown-container">
                        <div class="sidebar-item" onclick="toggleDropdown('sys-dropdown')">
                            <span>Система</span><span>&#9660;</span>
                        </div>
                        <div class="dropdown-menu open" id="sys-dropdown">
                            <div class="sidebar-item ${currentSubPage==='dictionaries'?'active':''}" onclick="loadSubPage('dictionaries')">Довідники</div>
                        </div>
                    </div>
                    <div class="dropdown-container">
                        <div class="sidebar-item" onclick="toggleDropdown('proj-dropdown')">
                            <span>Проєкт</span><span>&#9660;</span>
                        </div>
                        <div class="dropdown-menu open" id="proj-dropdown">
                            <div class="sidebar-item ${currentSubPage==='proj-logs'?'active':''}" onclick="loadSubPage('proj-logs')">Логи</div>
                            <div class="sidebar-item ${currentSubPage==='proj-db'?'active':''}" onclick="loadSubPage('proj-db')">База й таблиці</div>
                            <div class="sidebar-item ${currentSubPage==='proj-traffic'?'active':''}" onclick="loadSubPage('proj-traffic')">Трафік та логіни</div>
                        </div>
                    </div>
                `;
            }
        }

        function toggleDropdown(id) {
            document.getElementById(id).classList.toggle('open');
        }

        async function loadSubPage(sub) {
            currentSubPage = sub;
            renderSidebar();

            const container = document.getElementById('page-container');
            const breadcrumbs = document.getElementById('breadcrumbs');

            if (sub === 'queues') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Менеджмент / <b>Черги задач</b>`;
                container.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                        <h2 style="margin:0">Черги задач і звернень</h2>
                        <button class="btn btn-primary" onclick="loadQueuesData()">Оновити</button>
                    </div>
                    <div id="queues-summary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px"></div>
                    <div class="card">
                        <div class="card-header"><h2>Задачі за статусом</h2></div>
                        <table><thead><tr><th>Статус</th><th>Кількість</th></tr></thead><tbody id="queues-by-status"></tbody></table>
                    </div>
                    <div class="card">
                        <div class="card-header"><h2>За виконавцем (відкриті)</h2></div>
                        <table><thead><tr><th>Виконавець</th><th>Усього</th><th>Відкриті</th></tr></thead><tbody id="queues-by-assignee"></tbody></table>
                    </div>
                    <div class="card">
                        <div class="card-header"><h2>Звернення сьогодні за статусом</h2></div>
                        <table><thead><tr><th>Статус</th><th>Кількість</th></tr></thead><tbody id="queues-inc-status"></tbody></table>
                    </div>
                `;
                loadQueuesData();
            } else if (sub === 'tasks') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Менеджмент / <b>Усі задачі</b>`;
                container.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
                        <h2 style="margin:0">Адміністрування задач</h2>
                        <div style="display:flex;gap:8px;flex-wrap:wrap">
                            <input type="text" id="task-filter-user" placeholder="Виконавець" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px">
                            <select id="task-filter-status" style="padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px">
                                <option value="">Усі статуси</option>
                                <option>Нова</option><option>У роботі</option><option>На паузі</option>
                                <option>До перевірки</option><option>Виконана</option><option>Архів</option>
                            </select>
                            <button class="btn btn-primary" onclick="loadAdminTasks()">Оновити</button>
                        </div>
                    </div>
                    <div class="card" style="overflow-x:auto">
                        <table>
                            <thead><tr>
                                <th>ID</th><th>Дата</th><th>Виконавець</th><th>Відп.</th><th>Опис</th>
                                <th>Статус</th><th>Пріоритет</th><th>Час</th><th>Дії</th>
                            </tr></thead>
                            <tbody id="admin-tasks-table"><tr><td colspan="9">Завантаження…</td></tr></tbody>
                        </table>
                    </div>`;
                loadAdminTasks();
            } else if (sub === 'inc-archive') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Менеджмент / <b>Архів звернень</b>`;
                container.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
                        <h2 style="margin:0">Архів / історія звернень</h2>
                        <div style="display:flex;gap:8px;align-items:center">
                            <select id="inc-arch-status" onchange="loadIncArchive()">
                                <option value="all">Усі</option>
                                <option value="Вирішено" selected>Вирішено</option>
                                <option value="Архів">Архів</option>
                                <option value="Нове">Нове</option>
                                <option value="В роботі">В роботі</option>
                            </select>
                            <button class="btn btn-s" onclick="loadIncArchive()">Оновити</button>
                        </div>
                    </div>
                    <div id="inc-archive-list">Завантаження…</div>`;
                loadIncArchive();
            } else if (sub === 'approval') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Менеджмент / <b>Для затвердження</b>`;
                container.innerHTML = `<h2>Сторінка затвердження відпусток</h2><div id="requests-tables"></div>`;
                loadRequestsData();
            } else if (sub === 'dictionaries') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Налаштування / Система / <b>Довідники</b>`;
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header"><h2>Члени команди</h2><button class="btn btn-primary" onclick="openUserModal()">+ Додати користувача</button></div>
                        <table><thead><tr><th>Ім'я</th><th>Логін</th><th>Роль</th><th>Командна роль</th><th>Чергує?</th><th>Дії</th></tr></thead><tbody id="users-table"></tbody></table>
                    </div>
                    <div class="card">
                        <div class="card-header"><h2>Довідник ролей</h2><button class="btn btn-primary" onclick="openRoleModal()">+ Додати роль</button></div>
                        <table><thead><tr><th>ID</th><th>Назва ролі</th><th>Дії</th></tr></thead><tbody id="roles-table"></tbody></table>
                    </div>
                    <div class="card">
                        <div class="card-header"><h2>Типи відсутностей</h2><button class="btn btn-primary" onclick="openAbsModal()">+ Додати тип</button></div>
                        <table><thead><tr><th>ID</th><th>Назва</th><th>Код</th><th>Дії</th></tr></thead><tbody id="abs-types-table"></tbody></table>
                    </div>
                `;
                loadDictionariesData();
            } else if (sub === 'proj-logs') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Налаштування / Проєкт / <b>Логи</b>`;
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h2>Логи програм та сервісів</h2>
                            <select id="app-log-filter" onchange="fetchAppLogs()">
                                <option value="All">Усі сервіси</option>
                                <option value="Auth Service">Auth Service</option>
                                <option value="OnCall Core">OnCall Core</option>
                                <option value="Admin Panel">Admin Panel</option>
                                <option value="Nginx Proxy">Nginx Proxy</option>
                            </select>
                        </div>
                        <div class="console-box" id="app-logs-box">Завантаження логів...</div>
                    </div>
                `;
                fetchAppLogs();
            } else if (sub === 'proj-db') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Налаштування / Проєкт / <b>База й таблиці</b>`;
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header"><h2>Моніторингова таблиця дій з БД</h2></div>
                        <table>
                            <thead><tr><th>Таблиця</th><th>Кількість записів</th><th>Остання дія</th><th>Дата та час останньої зміни</th></tr></thead>
                            <tbody id="db-stats-table"></tbody>
                        </table>
                    </div>
                    <div class="card">
                        <div class="card-header"><h2>Read-Only SQL Console</h2></div>
                        <div class="form-group">
                            <textarea id="sql-query" rows="3" placeholder="SELECT * FROM users LIMIT 10;"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="runSqlQuery()" style="margin-top:10px;">Виконати SELECT</button>
                        <div id="sql-results" style="margin-top:15px;"></div>
                    </div>
                `;
                fetchDBStats();
            } else if (sub === 'proj-traffic') {
                breadcrumbs.innerHTML = `Головна / Адміністрування / Налаштування / Проєкт / <b>Трафік та логіни</b>`;
                container.innerHTML = `
                    <div class="card">
                        <div class="card-header"><h2>Журнал дій та авторизацій у системі</h2></div>
                        <table>
                            <thead><tr><th>Час</th><th>Користувач</th><th>Дія</th><th>IP адреса</th><th>Деталі</th></tr></thead>
                            <tbody id="audit-logs-table"></tbody>
                        </table>
                    </div>
                `;
                fetchAuditLogs();
            }
        }

        // --- TODO: DICTIONARY CRUD FUNCTIONS ---
        async function safeJson(res) {
            if (!res.ok) {
                console.error('API', res.url, res.status);
                return [];
            }
            try { return await res.json(); } catch (e) { console.error(e); return []; }
        }
        async function loadDictionariesData() {
            const [uRes, rRes, aRes] = await Promise.all([
                fetch('/api/admin/users'),
                fetch('/api/admin/roles'),
                fetch('/api/admin/absence-types')
            ]);
            loadedUsers = await safeJson(uRes);
            loadedRoles = await safeJson(rRes);
            loadedAbsTypes = await safeJson(aRes);
            if (!Array.isArray(loadedUsers)) loadedUsers = [];
            if (!Array.isArray(loadedRoles)) loadedRoles = [];
            if (!Array.isArray(loadedAbsTypes)) loadedAbsTypes = [];

            // Render Users
            document.getElementById('users-table').innerHTML = (loadedUsers || []).map(u => `
                <tr>
                    <td>${u.name}</td>
                    <td>${u.username}</td>
                    <td>${u.role}</td>
                    <td>${u.team_role || '—'}</td>
                    <td>${u.is_oncall ? 'Так' : 'Ні'}</td>
                    <td>
                        <button class="btn" onclick="editUser(${u.id})">Редагувати</button>
                        <button class="btn btn-danger" onclick="deleteUser(${u.id})">Видалити</button>
                    </td>
                </tr>
            `).join('');

            // Render Roles
            document.getElementById('roles-table').innerHTML = (loadedRoles || []).map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td>${r.name}</td>
                    <td>
                        <button class="btn" onclick="editRole(${r.id}, '${r.name}')">Редагувати</button>
                        <button class="btn btn-danger" onclick="deleteRole(${r.id})">Видалити</button>
                    </td>
                </tr>
            `).join('');

            // Render Absence Types
            document.getElementById('abs-types-table').innerHTML = (loadedAbsTypes || []).map(a => `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.name}</td>
                    <td><code>${a.code}</code></td>
                    <td>
                        <button class="btn" onclick="editAbsType(${a.id}, '${a.name}', '${a.code}')">Редагувати</button>
                        <button class="btn btn-danger" onclick="deleteAbsType(${a.id})">Видалити</button>
                    </td>
                </tr>
            `).join('');

            // Populate User Team Roles select dropdown
            const roleSelect = document.getElementById('user-team-role');
            if (roleSelect) {
                roleSelect.innerHTML = (loadedRoles || []).map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            }
        }

        // Modal Helpers
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // User CRUD
        function openUserModal() {
            document.getElementById('user-id').value = '';
            document.getElementById('user-name').value = '';
            document.getElementById('user-username').value = '';
            document.getElementById('user-password').value = '';
            document.getElementById('user-role').value = 'user';
            document.getElementById('user-is-oncall').checked = true;
            document.getElementById('user-modal-title').innerText = 'Додати користувача';
            document.getElementById('user-modal').style.display = 'flex';
        }

        function editUser(id) {
            const u = loadedUsers.find(x => x.id === id);
            if (!u) return;
            document.getElementById('user-id').value = u.id;
            document.getElementById('user-name').value = u.name;
            document.getElementById('user-username').value = u.username;
            document.getElementById('user-password').value = '';
            document.getElementById('user-role').value = u.role;
            if (u.team_role_id) document.getElementById('user-team-role').value = u.team_role_id;
            document.getElementById('user-is-oncall').checked = u.is_oncall;
            document.getElementById('user-modal-title').innerText = 'Редагувати користувача';
            document.getElementById('user-modal').style.display = 'flex';
        }

        async function saveUser() {
            const id = document.getElementById('user-id').value;
            const payload = {
                id: id ? parseInt(id) : 0,
                name: document.getElementById('user-name').value,
                username: document.getElementById('user-username').value,
                password: document.getElementById('user-password').value,
                role: document.getElementById('user-role').value,
                team_role_id: parseInt(document.getElementById('user-team-role').value) || null,
                is_oncall: document.getElementById('user-is-oncall').checked
            };
            const method = id ? 'PUT' : 'POST';
            await fetch('/api/admin/users', { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            closeModal('user-modal');
            loadDictionariesData();
        }

        async function deleteUser(id) {
            if (!confirm('Видалити користувача?')) return;
            await fetch(`/api/admin/users?id=${id}`, { method: 'DELETE' });
            loadDictionariesData();
        }

        // Team Roles CRUD
        function openRoleModal() {
            document.getElementById('role-id').value = '';
            document.getElementById('role-name').value = '';
            document.getElementById('role-modal-title').innerText = 'Додати роль';
            document.getElementById('role-modal').style.display = 'flex';
        }

        function editRole(id, name) {
            document.getElementById('role-id').value = id;
            document.getElementById('role-name').value = name;
            document.getElementById('role-modal-title').innerText = 'Редагувати роль';
            document.getElementById('role-modal').style.display = 'flex';
        }

        async function saveRole() {
            const id = document.getElementById('role-id').value;
            const payload = { id: id ? parseInt(id) : 0, name: document.getElementById('role-name').value };
            const method = id ? 'PUT' : 'POST';
            await fetch('/api/admin/roles', { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            closeModal('role-modal');
            loadDictionariesData();
        }

        async function deleteRole(id) {
            if (!confirm('Видалити роль?')) return;
            await fetch(`/api/admin/roles?id=${id}`, { method: 'DELETE' });
            loadDictionariesData();
        }

        // Absence Types CRUD
        function openAbsModal() {
            document.getElementById('abs-id').value = '';
            document.getElementById('abs-name').value = '';
            document.getElementById('abs-code').value = '';
            document.getElementById('abs-modal-title').innerText = 'Додати тип відсутності';
            document.getElementById('abs-modal').style.display = 'flex';
        }

        function editAbsType(id, name, code) {
            document.getElementById('abs-id').value = id;
            document.getElementById('abs-name').value = name;
            document.getElementById('abs-code').value = code;
            document.getElementById('abs-modal-title').innerText = 'Редагувати тип відсутності';
            document.getElementById('abs-modal').style.display = 'flex';
        }

        async function saveAbsenceType() {
            const id = document.getElementById('abs-id').value;
            const payload = {
                id: id ? parseInt(id) : 0,
                name: document.getElementById('abs-name').value,
                code: document.getElementById('abs-code').value
            };
            const method = id ? 'PUT' : 'POST';
            await fetch('/api/admin/absence-types', { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            closeModal('abs-modal');
            loadDictionariesData();
        }

        async function deleteAbsType(id) {
            if (!confirm('Видалити тип відсутності?')) return;
            await fetch(`/api/admin/absence-types?id=${id}`, { method: 'DELETE' });
            loadDictionariesData();
        }

        // --- OTHER FETCHERS ---
        async function fetchAppLogs() {
            const filter = document.getElementById('app-log-filter').value;
            const res = await fetch(`/api/admin/project/app-logs?app=${filter}`);
            const data = await res.json();
            const box = document.getElementById('app-logs-box');
            if (data && data.length > 0) {
                box.innerText = data.map(l => `[${l.timestamp}] [${l.app}] [${l.level}]: ${l.message}`).join('\n');
            } else {
                box.innerText = 'Логи відсутні';
            }
        }

        async function fetchDBStats() {
            const res = await fetch('/api/admin/project/db-stats');
            const data = await res.json();
            const tbody = document.getElementById('db-stats-table');
            tbody.innerHTML = '';
            data.forEach(s => {
                tbody.innerHTML += `<tr><td><code>${s.table_name}</code></td><td>${s.row_count}</td><td><span class="badge badge-secondary">${s.last_action}</span></td><td>${s.last_update}</td></tr>`;
            });
        }

        async function runSqlQuery() {
            const query = document.getElementById('sql-query').value;
            const res = await fetch('/api/admin/project/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const div = document.getElementById('sql-results');
            if (!res.ok) {
                const err = await res.text();
                div.innerHTML = `<div style="color:red;">Помилка: ${err}</div>`;
                return;
            }
            const data = await res.json();
            if (!data.rows || data.rows.length === 0) {
                div.innerHTML = '<em>Результатів немає</em>';
                return;
            }

            let html = '<table><thead><tr>' + data.columns.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
            data.rows.forEach(r => {
                html += '<tr>' + data.columns.map(c => `<td>${r[c] !== null ? r[c] : ''}</td>`).join('') + '</tr>';
            });
            html += '</tbody></table>';
            div.innerHTML = html;
        }

        async function fetchAuditLogs() {
            const res = await fetch('/api/admin/project/audit-logs');
            const data = await res.json();
            const tbody = document.getElementById('audit-logs-table');
            tbody.innerHTML = '';
            data.forEach(l => {
                tbody.innerHTML += `<tr><td>${l.timestamp}</td><td><strong>${l.user_name}</strong></td><td><span class="badge badge-warning">${l.action}</span></td><td>${l.ip}</td><td>${l.details}</td></tr>`;
            });
        }

        async function loadRequestsData() {
            const [reqRes, typesRes] = await Promise.all([fetch('/api/admin/requests'), fetch('/api/admin/absence-types')]);
            const requests = await reqRes.json();
            const types = await typesRes.json();
            const container = document.getElementById('requests-tables');
            container.innerHTML = '';

            types.forEach(t => {
                const filtered = requests.filter(r => r.type === t.code || r.type === t.name);
                let rows = '';
                filtered.forEach(req => {
                    let actionsHtml = req.status === 'Pending' ? `<button class="btn btn-primary" onclick="updateReq(${req.id}, 'Approved')">Затвердити</button> <button class="btn btn-danger" onclick="updateReq(${req.id}, 'Rejected')">Відхилити</button>` : '—';
                    rows += `<tr><td>${req.user_name}</td><td>${req.start_date}</td><td>${req.end_date}</td><td><span class="badge badge-secondary">${req.status}</span></td><td>${actionsHtml}</td></tr>`;
                });
                container.innerHTML += `<div class="card"><div class="card-header"><h2>Заявки: ${t.name}</h2></div><table><thead><tr><th>Користувач</th><th>Початок</th><th>Кінець</th><th>Статус</th><th>Дії</th></tr></thead><tbody>${rows || '<tr><td colspan="5">Немає заявок</td></tr>'}</tbody></table></div>`;
            });
        }

        async function updateReq(id, status) {
            await fetch('/api/admin/requests', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, status }) });
            loadRequestsData();
        }

        async function loadQueuesData() {
            try {
                const r = await fetch('/api/admin/queues');
                if (!r.ok) { alert('Помилка завантаження черг: ' + (await r.text())); return; }
                const d = await r.json();
                const sum = document.getElementById('queues-summary');
                if (sum) {
                    sum.innerHTML = `
                        <div class="card" style="padding:14px;text-align:center"><div style="font-size:11px;color:#64748b">Сьогодні</div><div style="font-size:22px;font-weight:700">${d.today||'—'}</div></div>
                        <div class="card" style="padding:14px;text-align:center;border-left:4px solid #ef4444"><div style="font-size:11px;color:#64748b">Прострочені</div><div style="font-size:22px;font-weight:700;color:#ef4444">${d.tasks_overdue||0}</div></div>
                        <div class="card" style="padding:14px;text-align:center;border-left:4px solid #f59e0b"><div style="font-size:11px;color:#64748b">Due сьогодні</div><div style="font-size:22px;font-weight:700;color:#f59e0b">${d.tasks_due_today||0}</div></div>
                        <div class="card" style="padding:14px;text-align:center;border-left:4px solid #2563eb"><div style="font-size:11px;color:#64748b">Звернення сьогодні</div><div style="font-size:22px;font-weight:700;color:#2563eb">${(d.incidents_today_by_status&&d.incidents_today_by_status['усі'])||0}</div></div>
                    `;
                }
                const stBody = document.getElementById('queues-by-status');
                if (stBody) {
                    const by = d.tasks_by_status || {};
                    const order = ['Нова','У роботі','На паузі','До перевірки','Виконана','Перевідкрита'];
                    const keys = [...order.filter(k=>by[k]!=null), ...Object.keys(by).filter(k=>!order.includes(k))];
                    stBody.innerHTML = keys.length
                        ? keys.map(k=>`<tr><td><span class="badge badge-secondary">${k}</span></td><td><b>${by[k]}</b></td></tr>`).join('')
                        : '<tr><td colspan="2">Немає задач</td></tr>';
                }
                const asBody = document.getElementById('queues-by-assignee');
                if (asBody) {
                    const list = d.tasks_by_assignee || [];
                    asBody.innerHTML = list.length
                        ? list.map(a=>`<tr><td>${a.name}</td><td>${a.count}</td><td><b style="color:${a.open>0?'#ef4444':'#16a34a'}">${a.open}</b></td></tr>`).join('')
                        : '<tr><td colspan="3">Немає</td></tr>';
                }
                const incBody = document.getElementById('queues-inc-status');
                if (incBody) {
                    const by = d.incidents_today_by_status || {};
                    const order = ['Нове','В роботі','На паузі','Вирішено','Архів'];
                    const keys = [...order.filter(k=>by[k]!=null), ...Object.keys(by).filter(k=>k!=='усі'&&!order.includes(k))];
                    incBody.innerHTML = keys.length
                        ? keys.map(k=>`<tr><td><span class="badge badge-secondary">${k}</span></td><td><b>${by[k]}</b></td></tr>`).join('')
                        : '<tr><td colspan="2">Немає звернень сьогодні</td></tr>';
                }
            } catch (e) {
                alert('Помилка: ' + e.message);
            }
        }
    
        async function loadIncArchive() {
            const st = (document.getElementById('inc-arch-status') || {}).value || 'all';
            const box = document.getElementById('inc-archive-list');
            if (!box) return;
            box.innerHTML = 'Завантаження…';
            try {
                const r = await fetch('/api/incidents?status=' + encodeURIComponent(st) + '&limit=100');
                const list = await r.json();
                if (!Array.isArray(list) || !list.length) {
                    box.innerHTML = '<p style="color:#64748b">Немає звернень</p>';
                    return;
                }
                let h = '<table><thead><tr><th>ID</th><th>Дата</th><th>Виконавець</th><th>Статус</th><th>Source</th><th>Опис</th><th></th></tr></thead><tbody>';
                list.forEach(i => {
                    h += `<tr>
                        <td>#${i.id}</td>
                        <td>${escHtml(i.date)}</td>
                        <td>${escHtml(i.user_name || '—')}</td>
                        <td>${escHtml(i.status)}</td>
                        <td>${escHtml(i.source)}</td>
                        <td>${escHtml(i.description || '')}</td>
                        <td><button class="btn btn-s" style="padding:2px 8px" onclick="toggleArchCmt(${i.id})">💬</button></td>
                    </tr>
                    <tr id="arch-cmt-${i.id}" style="display:none"><td colspan="7"><div id="arch-cmt-body-${i.id}" style="padding:8px 12px;background:#f8fafc;font-size:13px">…</div></td></tr>`;
                });
                h += '</tbody></table>';
                box.innerHTML = h;
            } catch (e) {
                box.innerHTML = '<p style="color:#ef4444">Помилка: ' + e + '</p>';
            }
        }
        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }
        async function toggleArchCmt(id) {
            const row = document.getElementById('arch-cmt-' + id);
            if (!row) return;
            const show = row.style.display === 'none';
            row.style.display = show ? '' : 'none';
            if (!show) return;
            const body = document.getElementById('arch-cmt-body-' + id);
            body.innerHTML = 'Завантаження коментарів…';
            try {
                const r = await fetch('/api/comments?entity_type=incident&entity_id=' + id);
                const list = await r.json();
                if (!Array.isArray(list) || !list.length) {
                    body.innerHTML = '<em style="color:#94a3b8">Коментарів немає</em>';
                    return;
                }
                body.innerHTML = list.map(c => {
                    const who = c.is_system ? '<em>system</em>' : escHtml(c.author_name || '');
                    return `<div style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #e2e8f0">
                        <div style="font-size:11px;color:#64748b">${who} · ${escHtml(c.created_at || '')}</div>
                        <div>${escHtml(c.body)}</div>
                    </div>`;
                }).join('');
            } catch (e) {
                body.innerHTML = '<span style="color:#ef4444">' + e + '</span>';
            }
        }

        async function loadAdminTasks() {
            const tb = document.getElementById('admin-tasks-table');
            if (!tb) return;
            tb.innerHTML = '<tr><td colspan="9">Завантаження…</td></tr>';
            const user = (document.getElementById('task-filter-user') || {}).value || '';
            const status = (document.getElementById('task-filter-status') || {}).value || '';
            const q = new URLSearchParams();
            if (user) q.set('user', user);
            if (status) q.set('status', status);
            try {
                const r = await fetch('/api/admin/tasks?' + q.toString());
                const list = await safeJson(r);
                if (!Array.isArray(list) || !list.length) {
                    tb.innerHTML = '<tr><td colspan="9" style="color:#64748b">Немає задач</td></tr>';
                    return;
                }
                const statuses = ['Нова','У роботі','На паузі','До перевірки','Виконана','Перевідкрита','Архів'];
                const prios = ['Базова','Термінова','Надкритична','Техборг','У шухляду'];
                tb.innerHTML = list.map(t => {
                    const stOpts = statuses.map(s => `<option ${s===(t.status||'Нова')?'selected':''}>${s}</option>`).join('');
                    const prOpts = prios.map(s => `<option ${s===(t.priority||'Базова')?'selected':''}>${s}</option>`).join('');
                    const desc = (t.task_description||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    const un = (t.user_name||'').replace(/"/g,'&quot;');
                    return `<tr>
                        <td>#${t.id}</td>
                        <td>${t.date||''}</td>
                        <td><input style="width:100px;padding:4px" value="${un}" onchange="adminUpdTask(${t.id},'user_name',this.value)"></td>
                        <td>${(t.responsible||'—')}</td>
                        <td style="max-width:280px">${desc}</td>
                        <td><select onchange="adminUpdTask(${t.id},'status',this.value)">${stOpts}</select></td>
                        <td><select onchange="adminUpdTask(${t.id},'priority',this.value)">${prOpts}</select></td>
                        <td>${t.total_minutes||0} хв</td>
                        <td><button class="btn btn-danger" style="padding:2px 8px" onclick="adminDelTask(${t.id})">✕</button></td>
                    </tr>`;
                }).join('');
            } catch (e) {
                tb.innerHTML = `<tr><td colspan="9" style="color:#ef4444">${e}</td></tr>`;
            }
        }
        async function adminUpdTask(id, field, val) {
            const body = { id, role: 'admin', actor: (currentUser && currentUser.name) || 'admin' };
            body[field] = val;
            const r = await fetch('/api/admin/tasks', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            if (!r.ok) alert(await r.text() || 'Помилка');
            else loadAdminTasks();
        }
        async function adminDelTask(id) {
            if (!confirm('Видалити задачу #' + id + '?')) return;
            await fetch('/api/admin/tasks?id=' + id, { method: 'DELETE' });
            loadAdminTasks();
        }
</script>
