        .card {

            padding: 20px;

        .card-header {

:root, [data-theme="light"] {

  --input-bg: #fff; --table-head: #f8fafc;
}
[data-theme="dark"] {

}
html, body { background: var(--bg) !important; color: var(--text) !important; }
.navbar { background: var(--nav) !important; color: var(--text) !important; border-color: var(--border) !important; }
.sidebar { background: var(--side) !important; }

table th { background: var(--table-head) !important; }
input, select, textarea { background: var(--input-bg) !important; color: var(--text) !important; border-color: var(--border) !important; }
.theme-toggle { display:inline-flex; gap:4px; align-items:center; margin-right:12px; }

.theme-toggle button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

    <script>

(function(){
  const KEY='oncall_theme';
  function sysTheme(){ return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light'; }
  function applyTheme(mode){
    const m = mode||localStorage.getItem(KEY)||'system';
    const resolved = m==='system' ? sysTheme() : m;
    document.documentElement.setAttribute('data-theme', resolved);
    document.querySelectorAll('.theme-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.theme===m));
  }
  window.setTheme = function(mode){
    localStorage.setItem(KEY, mode);
    document.cookie = 'oncall_theme='+encodeURIComponent(mode)+'; Path=/; Max-Age='+(30*24*3600)+'; SameSite=Lax';
    applyTheme(mode);
  };
  function isLastDayOfMonth(d){ const t=new Date(d.getFullYear(), d.getMonth()+1, 0); return d.getDate()===t.getDate(); }
  function clearServiceCookies(){
    const keep=new Set(['oncall_user','oncall_name']);
    document.cookie.split(';').forEach(c=>{
      const name=c.split('=')[0].trim();
      if(!name||keep.has(name)) return;
      if(name.startsWith('oncall_')) document.cookie=name+'=; Path=/; Max-Age=0; SameSite=Lax';
    });
  }
  const now=new Date();
  const marker=now.getFullYear()+'-'+(now.getMonth()+1);
  if(isLastDayOfMonth(now)){
    if(localStorage.getItem('oncall_cookie_reset')!==marker){ clearServiceCookies(); localStorage.setItem('oncall_cookie_reset', marker); }
  }
  applyTheme();
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if((localStorage.getItem(KEY)||'system')==='system') applyTheme('system'); }); }catch(e){}
})();
function themeToggleHTML(){
  return '<span class="theme-toggle">'+
    '<button type="button" data-theme="system" onclick="setTheme(\'system\')">Авто</button>'+
    '<button type="button" data-theme="light" onclick="setTheme(\'light\')">☀</button>'+
    '<button type="button" data-theme="dark" onclick="setTheme(\'dark\')">🌙</button></span>';
}


        let currentUser = null;

        window.onload = function() {
            // index.html stores session as 'u'; keep fallback to 'currentUser'
            const saved = localStorage.getItem('u') || localStorage.getItem('currentUser');
            if (!saved) { window.location.href = '/'; return; }

                window.location.href = '/';
                return;

            document.getElementById('user-info').innerText = `${currentUser.name} (${currentUser.role})`;
            switchMainMenu('management');
        };

            if (menu === 'settings') loadSubPage('dictionaries');

        async function runSqlQuery() {
            const query = document.getElementById('sql-query').value;
            const res = await fetch('/api/admin/project/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const div = document.getElementById('sql-results');
            if (!res.ok) {
                const err = await res.text();
                div.innerHTML = `<div style="color:red;">Помилка: ${err}</div>`;
                return;
            }
            const data = await res.json();
            if (!data.rows || data.rows.length === 0) {
                div.innerHTML = '<em>Результатів немає</em>';
                return;
            }

            let html = '<table><thead><tr>' + data.columns.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
            data.rows.forEach(r => {
                html += '<tr>' + data.columns.map(c => `<td>${r[c] !== null ? r[c] : ''}</td>`).join('') + '</tr>';
            });
            html += '</tbody></table>';
            div.innerHTML = html;
        }

        async function loadIncArchive() {
            await ensureUsersLoaded();
            const st = (document.getElementById('inc-arch-status') || {}).value || 'all';
            const user = (document.getElementById('inc-filter-user') || {}).value || '';
            const tb = document.getElementById('admin-incs-table');
            if (!tb) return;
            tb.innerHTML = '<tr><td colspan="9">Завантаження…</td></tr>';
            const q = new URLSearchParams({ limit: '200' });
            if (st && st !== 'all') q.set('status', st);
            if (user) q.set('user', user);
            try {
                const r = await fetch('/api/incidents?' + q.toString());
                const list = await safeJson(r);
                window._adminIncsCache = list;
                if (!Array.isArray(list) || !list.length) {
                    tb.innerHTML = '<tr><td colspan="9" style="color:#64748b">Немає звернень</td></tr>';
                    return;
                }
                const statuses = ['Нове','В роботі','На паузі','Вирішено','Архів'];
                const prios = ['Звичайний','Підвищений','Високий','Критичний','Терміновий'];
                list.forEach(i => { if (i.priority && !prios.includes(i.priority)) prios.push(i.priority); });
                tb.innerHTML = list.map(inc => {
                    const stOpts = statuses.map(s => `<option ${s===(inc.status||'Нове')?'selected':''}>${s}</option>`).join('');
                    const prOpts = prios.map(s => `<option ${s===(inc.priority||'Звичайний')?'selected':''}>${s}</option>`).join('');

        async function loadAdminTasks() {
            await ensureUsersLoaded();
            const tb = document.getElementById('admin-tasks-table');
            if (!tb) return;
            tb.innerHTML = '<tr><td colspan="9">Завантаження…</td></tr>';
            const user = (document.getElementById('task-filter-user') || {}).value || '';
            const status = (document.getElementById('task-filter-status') || {}).value || '';
            const q = new URLSearchParams();
            if (user) q.set('user', user);
            if (status) q.set('status', status);
            try {
                const r = await fetch('/api/admin/tasks?' + q.toString());
                let list = await safeJson(r);
                if (!Array.isArray(list)) list = [];
                // hide duplicate tasks from same incident (keep lowest id)
                const byInc = new Map();
                const filtered = [];
                [...list].sort((a,b)=>(a.id||0)-(b.id||0)).forEach(task => {
                  const m = String(task.task_description||'').match(/\[зі звернення #(\d+)\]/);
                  if (m) {
                    const iid = +m[1];
                    if (byInc.has(iid)) return;
                    byInc.set(iid, task.id);
                  }
                  filtered.push(task);
                });
                list = filtered;
                window._adminTasksCache = list;
                if (!list.length) {
                    tb.innerHTML = '<tr><td colspan="9" style="color:#64748b">Немає задач</td></tr>';
                    return;
                }
                const statuses = ['Нова','У роботі','На паузі','До перевірки','Виконана','Перевідкрита','Архів'];
                const prios = ['Базова','Термінова','Надкритична','Техборг','У шухляду'];
                tb.innerHTML = list.map(task => {
                    const stOpts = statuses.map(s => `<option ${s===(task.status||'Нова')?'selected':''}>${s}</option>`).join('');
                    const prOpts = prios.map(s => `<option ${s===(task.priority||'Базова')?'selected':''}>${s}</option>`).join('');
                    const desc = (task.task_description||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    const assignees = (task.assignees||[]).map(a => a.user_name).filter(Boolean);
                    const asHtml = assignees.length
                        ? assignees.map(a => {
                            const mins = ((task.assignees||[]).find(x=>x.user_name===a)||{}).total_minutes||0;
                            return `<span style="display:inline-block;background:#e0f2fe;padding:1px 6px;border-radius:4px;margin:1px;font-size:12px">${a} (${mins}хв)</span>`;
                          }).join('')
                        : '';
                    return `<tr>
                        <td>#${task.id}</td>
                        <td>${task.date||''}</td>
                        <td>${memberSelectHtml(task.user_name||'', `adminUpdTask(${task.id},'user_name',this.value)`, '— на розгляді —')}
                            <div style="margin-top:4px">${asHtml}</div>
                            <button class="btn" style="padding:1px 6px;font-size:11px;margin-top:2px" onclick="adminEditAssignees(${task.id})">+ виконавці</button>
                        </td>
                        <td>${(task.responsible||'—')}</td>
                        <td style="max-width:280px">${desc}</td>
                        <td><select onchange="adminUpdTask(${task.id},'status',this.value)">${stOpts}</select></td>
                        <td><select onchange="adminUpdTask(${task.id},'priority',this.value)">${prOpts}</select></td>
                        <td>${task.total_minutes||0} хв</td>
                        <td style="white-space:nowrap">
                            <button class="btn" style="padding:2px 8px" title="Редагувати" onclick="openEditTask(${task.id})">✎</button>
                            <button class="btn btn-danger" style="padding:2px 8px" onclick="adminDelTask(${task.id})">✕</button>
                        </td>
                    </tr>`;
                }).join('');
            } catch (e) {
                tb.innerHTML = `<tr><td colspan="9" style="color:#ef4444">${e}</td></tr>`;
            }
        }

        async function openTable(name) {
            const panel = document.getElementById('table-detail');
            const title = document.getElementById('table-detail-title');
            const schemaEl = document.getElementById('table-schema');
            const rowsEl = document.getElementById('table-rows');
            if (!panel) return;
            panel.style.display = 'block';
            title.textContent = 'Таблиця: ' + name;
            schemaEl.innerHTML = rowsEl.innerHTML = 'Завантаження…';
            try {
                const r = await fetch('/api/admin/project/table?name=' + encodeURIComponent(name) + '&limit=100');
                const d = await r.json();
                if (!r.ok) { schemaEl.innerHTML = '<span style="color:#ef4444">'+(d.message||r.status)+'</span>'; return; }
                const schema = d.schema || [];
                schemaEl.innerHTML = `<table><thead><tr><th>#</th><th>Колонка</th><th>Тип</th><th>NOT NULL</th><th>PK</th></tr></thead><tbody>` +
                    schema.map(c => `<tr><td>${c.cid}</td><td>${c.name}</td><td>${c.type}</td><td>${c.notnull?'так':'ні'}</td><td>${c.pk?'✓':''}</td></tr>`).join('') +
                    `</tbody></table>`;
                const cols = d.columns || [];
                const rows = d.rows || [];
                if (!rows.length) {
                    rowsEl.innerHTML = '<p style="color:#64748b">Порожня таблиця</p>';
                    return;
                }
                rowsEl.innerHTML = `<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>` +
                    rows.map(row => `<tr>${cols.map(c => {
                        let v = row[c];
                        if (v === null || v === undefined) v = '';
                        v = String(v).replace(/</g,'&lt;');
                        if (v.length > 120) v = v.slice(0,120)+'…';
                        return `<td>${v}</td>`;
                    }).join('')}</tr>`).join('') + `</tbody></table>`;
            } catch (e) {
                schemaEl.innerHTML = '<span style="color:#ef4444">'+e+'</span>';
            }
        }
        async function runSQL() {
            const sql = (document.getElementById('sql-input') || {}).value || '';
            const out = document.getElementById('sql-result');
            if (!out) return;
            out.innerHTML = '…';
            try {
                const r = await fetch('/api/admin/project/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-DB-Admin-Password': (window.DB_ADMIN_PASSWORD || 'db-admin-change-me') },
                    body: JSON.stringify({ query: sql })
                });
                const d = await r.json().catch(() => ({ error: 'bad json' }));
                if (!r.ok) { out.innerHTML = `<span style="color:#ef4444">${d.error || d.message || r.status}</span>`; return; }
                // flexible shape
                const cols = d.columns || (d.rows && d.rows[0] ? Object.keys(d.rows[0]) : []);
                const rows = d.rows || d.data || [];
                if (!rows.length) { out.innerHTML = '<p>Порожній результат</p>'; return; }
                out.innerHTML = `<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>` +
                    rows.map(row => `<tr>${cols.map(c => `<td>${String(row[c]??'').replace(/</g,'&lt;')}</td>`).join('')}</tr>`).join('') +
                    `</tbody></table>`;
            } catch (e) {
                out.innerHTML = `<span style="color:#ef4444">${e}</span>`;
            }
        }

        async function saveEditEntity() {
            const kind = document.getElementById('edit-entity-kind').value;
            const id = parseInt(document.getElementById('edit-entity-id').value, 10);
            const actor = (currentUser && currentUser.name) || 'admin';
            if (kind === 'task') {
                const body = {
                    id, role: 'admin', actor,
                    date: document.getElementById('edit-date').value,
                    user_name: document.getElementById('edit-user').value,
                    responsible: document.getElementById('edit-resp').value,
                    status: document.getElementById('edit-status').value,
                    priority: document.getElementById('edit-priority').value,
                    task_description: document.getElementById('edit-desc').value,
                    due_date: document.getElementById('edit-due').value,
                    visible_from: document.getElementById('edit-visible').value
                };
                const r = await fetch('/api/admin/tasks', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!r.ok) { alert(await r.text() || 'Помилка'); return; }
                closeEditEntity();
                loadAdminTasks();
            } else {
                const body = {
                    id, role: 'admin', actor,
                    date: document.getElementById('edit-date').value,
                    user_name: document.getElementById('edit-user').value,
                    status: document.getElementById('edit-status').value,
                    priority: document.getElementById('edit-priority').value,
                    description: document.getElementById('edit-desc').value,
                    duration_minutes: parseInt(document.getElementById('edit-duration').value, 10) || 15,
                    type: document.getElementById('edit-type').value,
                    source: document.getElementById('edit-source').value
                };
                const r = await fetch('/api/incidents', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!r.ok) { alert(await r.text() || 'Помилка'); return; }
                closeEditEntity();
                loadIncArchive();
            }
        }

            <input type="hidden" id="edit-entity-id">
            <div class="form-group"><label>Дата</label><input type="date" id="edit-date"></div>
            <div class="form-group" id="edit-type-wrap" style="display:none"><label>Тип</label>
                <select id="edit-type">
                    <option>Звернення</option><option>Інцидент</option><option>Консультація</option>
                </select>
            </div>
            <div class="form-group"><label>Виконавець</label><select id="edit-user"></select></div>
            <div class="form-group" id="edit-resp-wrap"><label>Відповідальний</label><select id="edit-resp"></select></div>
            <div class="form-group"><label>Статус</label><select id="edit-status"></select></div>
            <div class="form-group"><label>Пріоритет</label><select id="edit-priority"></select></div>
            <div class="form-group" id="edit-dur-wrap" style="display:none"><label>Тривалість (хв)</label><input type="number" id="edit-duration" min="1" step="1"></div>
            <div class="form-group" id="edit-due-wrap"><label>Дедлайн</label><input type="date" id="edit-due"></div>
            <div class="form-group" id="edit-vis-wrap"><label>Видима з</label><input type="date" id="edit-visible"></div>
            <div class="form-group" id="edit-src-wrap" style="display:none"><label>Source</label>
                <select id="edit-source">
                    <option value="self">self</option><option value="guest">guest</option>
                    <option value="team_lead">team_lead</option><option value="jira">jira</option><option value="bot">bot</option>
                </select>
            </div>
            <div class="form-group"><label>Опис</label><textarea id="edit-desc" rows="4" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px"></textarea></div>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
                <button class="btn" onclick="closeEditEntity()">Скасувати</button>
                <button class="btn btn-primary" onclick="saveEditEntity()">Зберегти</button>
            </div>
        </div>
    </div>

<script>document.addEventListener("DOMContentLoaded",function(){var tb=document.getElementById("theme-slot");if(tb){tb.innerHTML=themeToggleHTML();setTheme(localStorage.getItem("oncall_theme")||"system");}});</script>
</body>
</html>
