<!DOCTYPE html>
<html lang="uk"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>On-Call Schedule</title>
<style>
:root{--p:#2563eb;--bg:#f8fafc;--t:#0f172a;--b:#e2e8f0}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
.navbar{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100}
.nav-l{display:flex;align-items:center;gap:12px}.nav-r{display:flex;gap:8px;align-items:center}
.btn{background:var(--p);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{opacity:.9}.btn-d{background:#ef4444}.btn-s{background:#64748b}
.main{margin-top:72px;padding:16px;max-width:1200px;margin-left:auto;margin-right:auto}
.roster{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:#fff;border:1px solid var(--b);padding:6px 12px;border-radius:20px;font-size:13px}
.chip.on{border-color:var(--p);background:#eff6ff}.chip.off{opacity:.5;text-decoration:line-through}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dh{text-align:center;font-weight:600;font-size:12px;color:#64748b;padding:4px}
.dc{background:#fff;border:1px solid var(--b);border-radius:8px;min-height:90px;padding:6px;cursor:pointer;font-size:12px}
.dc:hover{border-color:var(--p)}.dn{font-weight:700;margin-bottom:4px}
.ba{color:#b45309;font-size:11px}.sc{color:#1e40af;font-size:11px;line-height:1.3}.bt{color:#7c3aed;font-size:11px}.bi{color:#dc2626;font-size:11px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--b);border-radius:8px;margin-top:8px;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--b);text-align:left}th{background:#f1f5f9;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;align-items:center;justify-content:center}
.mc{background:#fff;border-radius:12px;padding:20px;max-width:720px;width:92%;max-height:85vh;overflow:auto}
.mc h3{margin:0 0 12px}.fg{margin-bottom:10px}label{display:block;font-size:12px;color:#64748b;margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:6px;font-size:13px;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
.st{padding:2px 6px;border-radius:4px;background:#e0e7ff;font-size:11px}.prio{padding:2px 6px;border-radius:4px;background:#fef3c7;font-size:11px}
</style></head><body>
<div class="navbar"><div class="nav-l"><strong>On-Call</strong><span id="user-info" style="color:#64748b;font-size:13px"></span></div>
<div class="nav-r">
<button class="btn" id="btn-abs" style="display:none" onclick="openAbs()">Відсутність</button>
<button class="btn" id="btn-inc" style="display:none" onclick="openInc()">Звернення</button>
<button class="btn" id="btn-task" style="display:none" onclick="openTask()">Задача з дейлі</button>
<button class="btn btn-s" id="btn-adm" style="display:none" onclick="location.href='/admin.html'">Адмін</button>
<button class="btn btn-s" id="btn-auth" onclick="toggleAuth()">Увійти</button>
</div></div>

<div class="main">
<div class="roster" id="roster"></div>
<div class="cal-h"><button class="btn btn-s" onclick="chg(-1)">◀</button><h2 id="mt" style="margin:0"></h2><button class="btn btn-s" onclick="chg(1)">▶</button></div>
<div id="cal"><div class="dh">Пн</div><div class="dh">Вт</div><div class="dh">Ср</div><div class="dh">Чт</div><div class="dh">Пт</div><div class="dh">Сб</div><div class="dh">Нд</div></div>

<h3 style="margin-top:24px">Статистика</h3>
<table><thead><tr><th>Ім'я</th><th>Primary</th><th>Backup</th><th>Інциденти (год)</th></tr></thead><tbody id="stats"></tbody></table>
</div>

<div class="modal" id="m-login"><div class="mc" style="max-width:400px"><h3>Вхід</h3>
<div class="fg"><label>Логін</label><input id="lu"></div>
<div class="fg"><label>Пароль</label><input id="lp" type="password"></div>
<button class="btn" onclick="doLogin()">Увійти</button>
<button class="btn btn-s" onclick="cl('m-login')">Скасувати</button></div></div>

<div class="modal" id="m-abs"><div class="mc" style="max-width:400px"><h3>Відсутність</h3>
<div class="fg"><label>Тип</label><select id="at"></select></div>
<div class="fg"><label>З</label><input type="date" id="as"></div>
<div class="fg"><label>По</label><input type="date" id="ae"></div>
<button class="btn" onclick="subAbs()">Надіслати</button>
<button class="btn btn-s" onclick="cl('m-abs')">Скасувати</button></div></div>

<div class="modal" id="m-inc"><div class="mc" style="max-width:440px"><h3>Звернення</h3>
<div class="fg" id="inc-who-wrap" style="display:none"><label>Чиє звернення</label><select id="iuser"></select></div>
<div class="fg"><label>Дата</label><input type="date" id="id"></div>
<div class="fg"><label>Тип</label><select id="it"><option>Звернення</option><option>Інцидент</option><option>Консультація</option></select></div>
<div class="fg"><label>Тривалість (хв)</label><input type="number" id="im" min="1" value="15"></div>
<div class="fg"><label>Опис</label><textarea id="idesc"></textarea></div>
<p id="inc-hint" style="font-size:12px;color:#64748b"></p>
<button class="btn" onclick="subInc()">Зафіксувати</button>
<button class="btn btn-s" onclick="cl('m-inc')">Скасувати</button></div></div>

<div class="modal" id="m-task"><div class="mc" style="max-width:480px"><h3>Задача з дейлі</h3>
<div class="fg" id="task-assignee-wrap" style="display:none"><label>Виконавець</label><select id="tuser"></select></div>
<div class="fg" id="task-resp-wrap" style="display:none"><label>Відповідальна особа</label><select id="tresp"></select></div>
<div class="fg"><label>Дата</label><input type="date" id="td"></div>
<div class="fg"><label>Опис</label><textarea id="tdesc"></textarea></div>
<div class="fg"><label>Пріоритет</label><select id="tprio"><option>Базова</option><option>Надкритична</option><option>Термінова</option><option>Техборг</option><option>У шухляду</option></select></div>
<button class="btn" onclick="subTask()">Створити</button>
<button class="btn btn-s" onclick="cl('m-task')">Скасувати</button></div></div>

<div class="modal" id="m-day"><div class="mc"><h3 id="dt">День</h3>
<div id="ds"></div>
<h4>Відсутності</h4><div id="da"></div>
<h4>Задачі з дейлі</h4><div id="dtasks"></div>
<h4>Звернення</h4>
<div class="fg" style="max-width:220px"><label>Фільтр по члену команди</label>
<select id="inc-filter" onchange="renderDayIncs()"><option value="">Усі</option></select></div>
<div id="di"></div>
<button class="btn" style="margin-top:12px" onclick="cl('m-day')">Закрити</button></div></div>

<script>
const STATUSES=['Нова','У роботі','На паузі','До перевірки','Виконана','Перевідкрита','Архів'];
const PRIOS=['Надкритична','Термінова','Базова','Техборг','У шухляду'];
let U=null,Y=new Date().getFullYear(),M=new Date().getMonth()+1,AT=[],D={},_day='';

function today(){return new Date().toISOString().slice(0,10)}
function sess(){
  try{U=JSON.parse(localStorage.getItem('u'))}catch(e){U=null}
  const i=document.getElementById('user-info'),a=document.getElementById('btn-auth');
  if(U){i.innerText=U.name+(U.role==='admin'?' (admin)':'');a.innerText='Вийти';
    ['btn-abs','btn-inc','btn-task'].forEach(id=>document.getElementById(id).style.display='');
    document.getElementById('btn-adm').style.display=U.role==='admin'?'':'none'}
  else{i.innerText='';a.innerText='Увійти';
    ['btn-abs','btn-inc','btn-task','btn-adm'].forEach(id=>document.getElementById(id).style.display='none')}
}
function toggleAuth(){if(U){U=null;localStorage.removeItem('u');sess()}else document.getElementById('m-login').style.display='flex'}
function cl(id){document.getElementById(id).style.display='none'}
async function doLogin(){
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('lu').value,password:document.getElementById('lp').value})});
  if(r.ok){U=await r.json();localStorage.setItem('u',JSON.stringify(U));cl('m-login');sess()}else alert('Помилка входу');
}
async function load(){
  const r=await fetch(`/api/data?year=${Y}&month=${M}`);D=await r.json();AT=D.absence_types||[];
  roster(D.team_members||[],D.absences||[]);
  cal(D.year,D.month,D.shifts||{},D.absences||[],D.incidents||{},D.team_members||[],D.daily_tasks||{});
  stats(D.stats||[]);
}
function chg(n){M+=n;if(M<1){M=12;Y--}if(M>12){M=1;Y++}load()}
function inact(n,ds,abs){for(const a of abs||[])if(a.user_name===n&&ds>=a.start_date&&ds<=a.end_date)return true;return false}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function roster(ms,abs){
  const el=document.getElementById('roster'),t=today();
  if(!ms.length){el.innerHTML='<span style="color:#94a3b8">Команда порожня</span>';return}
  el.innerHTML=ms.map(m=>{const off=inact(m.name,t,abs);
    return `<span class="chip ${m.is_oncall?'on':''} ${off?'off':''}">${m.name}${m.team_role?' · '+m.team_role:''}${off?' (відсутній)':''}</span>`}).join('');
}
function cal(y,m,sh,abs,inc,tm,tasks){
  const mn=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  document.getElementById('mt').innerText=mn[m-1]+' '+y;
  const g=document.getElementById('cal');while(g.children.length>7)g.removeChild(g.lastChild);
  const fd=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate(),off=fd===0?6:fd-1;
  for(let i=0;i<off;i++){const e=document.createElement('div');e.className='dc';e.style.background='#fafafa';e.style.cursor='default';g.appendChild(e)}
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const c=document.createElement('div');c.className='dc';c.onclick=()=>day(ds);
    c.innerHTML=`<div class="dn">${d}</div>`;
    const da=(abs||[]).filter(a=>ds>=a.start_date&&ds<=a.end_date);
    if(da.length)c.innerHTML+=`<div class="ba">🏖️ ${da.map(a=>a.user_name.split(' ')[0]).join(', ')}</div>`;
    if(sh[ds])c.innerHTML+=`<div class="sc"><b>Осн:</b> ${sh[ds].primary_user}<br><b>Дубл:</b> ${sh[ds].backup_user}</div>`;
    const dt=(tasks||{})[ds]||[];
    if(dt.length)c.innerHTML+=`<div class="bt">📋 ${dt.length}</div>`;
    if(inc[ds]&&inc[ds].length){const t=inc[ds].reduce((s,i)=>s+i.duration_minutes,0);c.innerHTML+=`<div class="bi">⏱️ ${inc[ds].length} (${t}хв)</div>`}
    g.appendChild(c);
  }
}
function day(ds){
  _day=ds;document.getElementById('dt').innerText='День: '+ds;
  const s=D.shifts&&D.shifts[ds],ms=D.team_members||[],abs=D.absences||[];
  let h=s?`<b>Основний:</b> ${s.primary_user}<br><b>Дублюючий:</b> ${s.backup_user}`:'Чергування не призначено';
  document.getElementById('ds').innerHTML=h;
  const al=abs.filter(a=>ds>=a.start_date&&ds<=a.end_date);
  document.getElementById('da').innerHTML=al.length?al.map(a=>`• <b>${a.user_name}</b> (${a.type})`).join('<br>'):'Немає';

  const tasks=(D.daily_tasks||{})[ds]||[];
  if(tasks.length){
    let html='<table><thead><tr><th>Виконавець</th><th>Відповідальний</th><th>Задача</th><th>Статус</th><th>Пріоритет</th><th>Час</th><th></th></tr></thead><tbody>';
    tasks.forEach(t=>{
      const exec=t.user_name?esc(t.user_name):'<em style="color:#94a3b8">на розгляді</em>';
      const resp=esc(t.responsible||'—');
      const unassigned=!t.user_name;
      const isAdm=U&&U.role==='admin';
      const canStatus=U && (isAdm || !unassigned) && (isAdm || t.status!=='Виконана');
      const allowed=typeof nextStatuses==='function'?nextStatuses(t.status):(isAdm?STATUSES:['У роботі','На паузі','До перевірки','Виконана']);
      const stOpts=(allowed.length?allowed:[t.status]).map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('');
      const prOpts=PRIOS.map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('');
      html+=`<tr><td>${exec}</td><td>${resp}</td><td>${esc(t.task_description)}</td>
        <td>${canStatus?`<select onchange="updTask(${t.id},'status',this.value)">${stOpts}</select>`:`<span class="st">${esc(t.status)}</span>`}</td>
        <td>${isAdm?`<select onchange="updTask(${t.id},'priority',this.value)">${prOpts}</select>`:`<span class="prio">${esc(t.priority)}</span>`}</td>
        <td>${t.total_minutes||0} хв</td>
        <td>${isAdm?`<button class="btn btn-d" style="padding:2px 6px" onclick="delTask(${t.id})">✕</button>`:''}</td></tr>`;
    });
    html+='</tbody></table>';
    document.getElementById('dtasks').innerHTML=html;
  } else document.getElementById('dtasks').innerHTML='Задач немає';

  const sel=document.getElementById('inc-filter');
  const names=[...new Set(((D.incidents||{})[ds]||[]).map(i=>i.user_name))].sort();
  sel.innerHTML='<option value="">Усі</option>'+names.map(n=>`<option>${n}</option>`).join('');
  renderDayIncs();
  document.getElementById('m-day').style.display='flex';
}
function renderDayIncs(){
  const ds=_day, filter=document.getElementById('inc-filter').value;
  let incs=((D.incidents||{})[ds]||[]).slice();
  if(filter)incs=incs.filter(i=>i.user_name===filter);
  incs.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  if(!incs.length){document.getElementById('di').innerHTML='Немає';return}
  let html='<table><thead><tr><th>Час фіксації</th><th>Хто</th><th>Тип</th><th>Хв</th><th>Опис</th></tr></thead><tbody>';
  incs.forEach(i=>{html+=`<tr><td>${esc(i.created_at||'—')}</td><td>${esc(i.user_name)}</td><td>${esc(i.type)}</td><td>${i.duration_minutes}</td><td>${esc(i.description)}</td></tr>`});
  html+='</tbody></table>';
  document.getElementById('di').innerHTML=html;
}
function stats(st){const t=document.getElementById('stats');t.innerHTML='';(st||[]).forEach(s=>{
  t.innerHTML+=`<tr><td>${s.name}</td><td>${s.primary_count||0}</td><td>${s.backup_count||0}</td><td>${((s.incident_minutes||0)/60).toFixed(1)}</td></tr>`})}

function openAbs(){const s=document.getElementById('at');s.innerHTML='';AT.forEach(t=>{s.innerHTML+=`<option>${t.name}</option>`});
  document.getElementById('as').value=today();document.getElementById('ae').value=today();
  document.getElementById('m-abs').style.display='flex'}
async function subAbs(){
  const r=await fetch('/api/request-absence',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_name:U.name,type:document.getElementById('at').value,
      start_date:document.getElementById('as').value,end_date:document.getElementById('ae').value})});
  if(r.ok){alert('Надіслано');cl('m-abs');load()}else alert('Помилка')}

function fillMemberSelect(selId, includeSelf){
  const sel=document.getElementById(selId);
  const ms=(D.team_members||[]).filter(m=>m.role!=='admin'||m.is_oncall);
  let opts='';
  if(includeSelf&&U) opts+=`<option value="${esc(U.name)}">${esc(U.name)} (я)</option>`;
  ms.forEach(m=>{if(!includeSelf||m.name!==U.name)opts+=`<option value="${esc(m.name)}">${esc(m.name)}</option>`});
  sel.innerHTML=opts||`<option value="${esc(U&&U.name||'')}">${esc(U&&U.name||'')}</option>`;
}
function openInc(){
  document.getElementById('id').value=today();
  document.getElementById('im').value=15;document.getElementById('idesc').value='';
  const wrap=document.getElementById('inc-who-wrap');
  const hint=document.getElementById('inc-hint');
  if(U&&U.role==='admin'){
    wrap.style.display='';
    fillMemberSelect('iuser', true);
    hint.innerText='Admin може фіксувати на будь-яку дату і від імені будь-якого члена команди.';
  } else {
    wrap.style.display='none';
    hint.innerText='Можна фіксувати лише на сьогодні від свого імені. Майбутня дата → задача «для розгляду на дейлі».';
  }
  document.getElementById('m-inc').style.display='flex'}
async function subInc(){
  const who=(U&&U.role==='admin'&&document.getElementById('iuser').value)||U.name;
  const body={user_name:who,date:document.getElementById('id').value,type:document.getElementById('it').value,
    duration_minutes:+document.getElementById('im').value,description:document.getElementById('idesc').value.trim(),role:U.role};
  const r=await fetch('/api/incidents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){const j=await r.json();alert(j.message||'Зафіксовано');cl('m-inc');load()}else{const t=await r.text();alert(t||'Помилка')}}

function openTask(){
  document.getElementById('td').value=today();document.getElementById('tdesc').value='';document.getElementById('tprio').value='Базова';
  const isAdm=U&&U.role==='admin';
  const wrap=document.getElementById('task-assignee-wrap');
  const rw=document.getElementById('task-resp-wrap');
  if(wrap) wrap.style.display=isAdm?'':'none';
  if(rw) rw.style.display=isAdm?'':'none';
  if(isAdm){
    fillMemberSelect('tuser', true);
    const tu=document.getElementById('tuser');
    if(tu) tu.innerHTML='<option value="">— на розгляді —</option>'+tu.innerHTML;
    fillMemberSelect('tresp', true);
  }
  document.getElementById('m-task').style.display='flex'}
async function subTask(){
  const isAdm=U&&U.role==='admin';
  const who=isAdm?(document.getElementById('tuser').value||''):U.name;
  const body={user_name:who,date:document.getElementById('td').value,
    task_description:document.getElementById('tdesc').value.trim(),priority:document.getElementById('tprio').value,status:'Нова',
    created_by:U.name};
  if(isAdm){
    body.responsible=document.getElementById('tresp')?document.getElementById('tresp').value||'':'';
  }
  const r=await fetch('/api/daily-tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){alert('Збережено');cl('m-task');load()}else alert('Помилка')}
function nextStatuses(cur){
  const admin=U&&U.role==='admin';
  const map={
    'Нова': admin?['Нова','У роботі','Архів']:['У роботі'],
    'У роботі': admin?['У роботі','На паузі','До перевірки','Виконана','Архів']:['На паузі','До перевірки'],
    'На паузі': admin?['На паузі','У роботі','До перевірки','Архів']:['У роботі'],
    'До перевірки': admin?['До перевірки','У роботі','Виконана','Архів']:['Виконана'],
    'Виконана': admin?['Виконана','Перевідкрита','Архів']:[],
    'Перевідкрита': admin?['Перевідкрита','Нова','У роботі','Архів']:[],
    'Архів': admin?['Архів','Перевідкрита','Нова']:[]
  };
  return map[cur]||(admin?STATUSES:[]);
}
async function updTask(id,field,val){
  const body={id,role:U&&U.role||'user'};body[field]=val;
  const r=await fetch('/api/daily-tasks',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){alert(await r.text()||'Помилка');}
  load();day(_day)}
async function delTask(id){if(!confirm('Видалити?'))return;await fetch('/api/daily-tasks?id='+id,{method:'DELETE'});cl('m-day');load()}

sess();load();
</script></body></html>
