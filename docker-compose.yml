version: '3.8'

services:
  app:
    build: .
    container_name: oncall_app_4
    restart: always
    environment:
      - PORT=8084
    volumes:
      - ./data:/app/data
      - /var/log/oncall-app:/var/log/oncall-app

  nginx:
    image: nginx:alpine
    container_name: oncall_nginx_4
    restart: always
    ports:
      - "84:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - /var/log/oncall-app:/var/log/oncall-app
    depends_on:
      - app
