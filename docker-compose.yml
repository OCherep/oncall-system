# OnCall (module for /opt/ops/oncall + standalone)
# Host ports: ONLY 85→443. Never publish 80 (reserved for ops edge / Caddy).
# Internal :80 stays available on opsnet for reverse_proxy from edge.

services:
  app:
    build: .
    container_name: oncall_app_5
    restart: always
    environment:
      - PORT=8085
      - DB_PATH=/app/data/oncall.db
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD:-db-admin-change-me}
      - ENABLE_INCIDENT_WEBHOOK=${ENABLE_INCIDENT_WEBHOOK:-0}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-change-me-webhook-secret}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - ONCALL_READ_TOKEN=${ONCALL_READ_TOKEN:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_TEAM_CHANNEL=${SLACK_TEAM_CHANNEL:-}
      - DUTY_ANNOUNCE_ENABLED=${DUTY_ANNOUNCE_ENABLED:-1}
      - DUTY_ANNOUNCE_CHANNELS=${DUTY_ANNOUNCE_CHANNELS:-#devops-pm-direct,#devops_team}
      - DUTY_ANNOUNCE_TIME=${DUTY_ANNOUNCE_TIME:-09:00}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://s.ks.tv:85}
      - SESSION_SECURE=${SESSION_SECURE:-1}
      - NOTIFY_ON_INCIDENT=${NOTIFY_ON_INCIDENT:-1}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - JIRA_ENABLED=${JIRA_ENABLED:-0}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_STATUS_MAP=${JIRA_STATUS_MAP:-}
      - AUDIT_LOG_PATH=/var/log/oncall-app-5/app.log
      - TLS_CN=${TLS_CN:-s.ks.tv}
    volumes:
      - ./data:/app/data
      - /var/log/oncall-app-5:/var/log/oncall-app-5
    networks:
      - default
      - opsnet

  nginx:
    image: nginx:alpine
    container_name: oncall_nginx_5
    restart: always
    ports:
      - "85:443"
    environment:
      - TLS_CN=${TLS_CN:-s.ks.tv}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs
      - ./certbot/www:/var/www/certbot:ro
      - ./scripts/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - /var/log/oncall-app-5:/var/log/oncall-app-5
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    depends_on:
      - app
    networks:
      - default
      - opsnet

networks:
  opsnet:
    external: true
    name: opsnet
